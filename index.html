<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="styles.css" />
        <title>Winnipeg Tree Explorer</title>
    </head>
    <body>
        <header>
            <h1>Winnipeg Tree Explorer</h1>
        </header>
        <main>
            <div id="treeApp">

                <input type="text" id="treeSearch" placeholder="e.g. Ash" />
                <button onclick="displayTrees()">Search</button>
                <div id="message"></div>

            </div>
        </main>
        <script src="script.js"></script>
    </body>
</html>
